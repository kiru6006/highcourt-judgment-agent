name: Regenerate Screenshots & Social Preview

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/screenshots.ts'
      - 'scripts/generate-social-preview.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd web && npm ci && cd ..

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: cd web && npm run build && cd ..

      - name: Generate Social Preview
        run: npx tsx scripts/generate-social-preview.ts

      - name: Capture Production Screenshots
        run: npx tsx scripts/screenshots.ts

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(assets): update automated production screenshots and social preview [skip ci]"
            git push
          fi
