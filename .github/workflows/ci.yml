name: CI Quality & Budget Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Strict Typecheck & Lint
        working-directory: web
        run: npm run lint

      - name: Unit Tests
        working-directory: web
        run: npm run test

      - name: Production Build
        working-directory: web
        run: npm run build
        env:
          BASE_HREF: /highcourt-judgment-agent/

      - name: Performance & Size Budget Gate
        run: ./scripts/check-budget.sh
