name: Bug Report
description: Report an issue or unexpected behavior in NyayaReader
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! NyayaReader is an open-source, static-first legal research platform.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and screen resolution (e.g. Chrome 128 on macOS Sonoma, 1440x900).
      placeholder: "e.g. Firefox 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Open https://kiru6006.github.io/highcourt-judgment-agent/
        2. Search for '...'
        3. Click on judgment '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened, including any console errors.
    validations:
      required: true
