<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https://generativelanguage.googleapis.com https://*.github.io https://registry.opendata.aws; img-src 'self' data: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self';" />
    <title>NyayaReader — Indian High Court Judgment Search & Reader</title>
    <meta name="description" content="AI-native Indian High Court judgment search and reader for advocates, clerks, and legal researchers." />
    <!-- Single Page Apps for GitHub Pages redirect handler -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-paper-canvas text-ink-primary dark:bg-paper-darkCanvas dark:text-ink-darkPrimary transition-colors duration-150 antialiased selection:bg-amber-soft selection:text-amber-highlight">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
